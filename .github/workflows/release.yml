name: release

# Build, sign, and publish the Synapse desktop app + updater manifest on tag.
# Tag a version to ship:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Fail fast if someone tags vX.Y.Z without bumping the version baked into the
      # artifacts + latest.json — otherwise the updater ships a build that reports
      # the old version and never updates anyone.
      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $mismatch = @()
          if ($tag -ne $conf)  { $mismatch += "tauri.conf.json=$conf" }
          if ($tag -ne $pkg)   { $mismatch += "package.json=$pkg" }
          if ($tag -ne $cargo) { $mismatch += "Cargo.toml=$cargo" }
          if ($mismatch.Count -gt 0) {
            Write-Error "Tag '$tag' does not match: $($mismatch -join ', '). Bump the version in tauri.conf.json / package.json / Cargo.toml (all three) before tagging."
            exit 1
          }
          Write-Host "Version OK across all manifests: $conf"

      # The release body doubles as the in-app "what's new" (the update popover
      # renders it before the user installs), so fill it from the CHANGELOG
      # section for this version instead of tauri-action's placeholder text.
      - name: Extract release notes from CHANGELOG
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          $md = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($md, "(?s)## \[$([regex]::Escape($v))\][^`n]*`n(.*?)(?=`n## \[|$)")
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Synapse $v" }
          $delim = "NOTES_EOF_$(Get-Random)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<$delim"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delim

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # The rust-cache can restore a stale target/release/bundle from an earlier
      # build (e.g. MSI artifacts). Their leftover .sig files make tauri-action
      # see multiple updater signatures and skip latest.json. Start clean.
      - name: Remove stale bundles
        shell: pwsh
        run: if (Test-Path src-tauri/target/release/bundle) { Remove-Item -Recurse -Force src-tauri/target/release/bundle }

      - name: Build, sign, and publish (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Publishes the NSIS .exe + latest.json (the updater manifest the app
          # polls at releases/latest/download/latest.json).
          tagName: ${{ github.ref_name }}
          releaseName: "Synapse ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
