[package]
name = "synapse2-desktop"
version = "0.1.0"
edition = "2021"
description = "Synapse — Claude Code Workspace"
authors = ["Chris Cousens"]

[lib]
name = "synapse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tracing = "0.1"
portable-pty = "0.8"
arboard = "3"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
uuid = { version = "1", features = ["v4"] }
# synapse-core lives in the public Adlistic/Synapse repo (workspace member). The
# git dependency keeps this app buildable on CI/clean machines — no reliance on a
# local D:\Development\Synapse checkout.
synapse-core = { git = "https://github.com/Adlistic/Synapse", package = "synapse-core" }

[profile.release]
opt-level = "s"
lto = true
