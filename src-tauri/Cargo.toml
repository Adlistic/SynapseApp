[package]
name = "hypervoice-code"
version = "0.3.5"
edition = "2021"
description = "HyperVoice Code — a workspace for Claude Code and Codex"
authors = ["Chris Cousens"]

[lib]
name = "hypervoice_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tracing = "0.1"
portable-pty = "0.8"
arboard = "3"
# `windows-native` enables the Windows Credential Manager backend; without a
# backend feature, keyring v3 silently no-ops (tokens never persist).
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
uuid = { version = "1", features = ["v4"] }
# synapse-core is vendored into this repo (../synapse-core) so the app is
# self-contained — no build-time dependency on the private Adlistic/Synapse repo.
synapse-core = { path = "../synapse-core" }
tauri-plugin-notification = "2"
# Persists window size/position/maximized state across restarts.
tauri-plugin-window-state = "2"
# The app-owned updater's periodic check loop (updater.rs) sleeps on tokio time.
tokio = { version = "1", features = ["time"] }
# Reads Codex CLI session files, which Codex compresses (zstd) once a session
# is closed. Pure Rust: no C toolchain needed.
ruzstd = "0.8"

[profile.release]
opt-level = "s"
lto = true
